# Render Blueprint: two API instances of the same code and one shared recommendation service.
#   libverse-demo-api  the LIVE DEMO (DEMO_MODE=true, database libverse_demo, one-click demo sign-in)
#   libverse-api       the FULL APP (production, database libverse, email sign-up with a verification
#                      code, email sign-in codes, Sign in with Google; email through Brevo or SMTP)
#   libverse-ai        recommendations for both; each API trains and asks with its own AI_CATALOG
#                      (demo / production), so the two catalogues never mix
# The two websites are Vercel projects (frontend/vercel.json). Step-by-step guide: DEPLOYMENT.md
#
# Environment variables are listed by NAME only (sync: false): Render asks for each value when
# the Blueprint is created. Never commit real values.
services:
  - type: web
    name: libverse-demo-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    # 200 only while MongoDB is connected
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        sync: false
      - key: NODE_ENV
        sync: false
      # The demo database (name libverse_demo), never the production one
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # true: one-click demo sign-in only (no password login, signup, email codes, password reset or Google)
      - key: DEMO_MODE
        sync: false
      - key: DEMO_JWT_EXPIRE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CSP_API_ORIGINS
        sync: false
      - key: TRUST_PROXY
        sync: false
      - key: REMINDERS_ENABLED
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      # demo
      - key: AI_CATALOG
        sync: false

  - type: web
    name: libverse-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        sync: false
      - key: NODE_ENV
        sync: false
      # The production database (name libverse)
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CSP_API_ORIGINS
        sync: false
      - key: TRUST_PROXY
        sync: false
      - key: REMINDERS_ENABLED
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      # production
      - key: AI_CATALOG
        sync: false
      # Sign in with Google: the OAuth client ID (no secret needed)
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Email (verification codes, email sign-in codes, forgot password): Brevo HTTPS API first ...
      - key: BREVO_API_KEY
        sync: false
      # The sender address verified in Brevo, and its display name
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      # ... SMTP as the fallback (optional: leave these empty to use Brevo only)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: web
    name: libverse-ai
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # Pinned (not a secret): numpy 1.24 in requirements.txt has no wheels for Python 3.12+.
      # Keep in step with ai-service/.python-version and the CI ai-service job.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HOST
        sync: false
      # The same token on both APIs
      - key: AI_SERVICE_TOKEN
        sync: false
      # Both API URLs, comma-separated
      - key: CORS_ORIGINS
        sync: false
